[package]
name = "storage-reorg-audit"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
libmdbx = "0.6"
noid_chain = { path = "pinned/noid_chain" }
noid_poseidon2b = { path = "pinned/noid_poseidon2b" }
noid_tx = { path = "pinned/noid_tx" }
tempfile = "3"

[workspace]
exclude = ["pinned"]

[profile.dev]
opt-level = 1
debug = 0

[profile.release]
lto = false
codegen-units = 16
