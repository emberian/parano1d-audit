[package]
name = "intentool"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
hex = "0.4"
# Built against the SAME tree as the shared early-finance binaries
# (experiments/shared-early-finance/tree): pin + V2@10/V2.1@24, m24
# genesis. native_chain_id() hashes the genesis header, so the intentool
# build must match the devnet's genesis exactly.
# The scaled log-8 fallback tree stays at ../tree (shelved; see HANDOFF.md).
noid_chain = { path = "../../shared-early-finance/tree/noid_chain" }
noid_gkr = { path = "../../shared-early-finance/tree/noid_gkr" }
noid_poseidon2b = { path = "../../shared-early-finance/tree/noid_poseidon2b" }
noid_tx = { path = "../../shared-early-finance/tree/noid_tx" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
