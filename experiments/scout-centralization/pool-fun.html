<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Parano1d Pool — offline</title>
<style>
:root{--f:#000401;--c:#c9ffd6;--v:#00ff41;color-scheme:dark}
body{margin:0;background:var(--f);color:var(--c);
 font:16px/1.6 ui-monospace,"Cascadia Code",Consolas,monospace;
 display:flex;align-items:center;justify-content:center;
 min-height:100vh;text-align:center;padding:1rem}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
 background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,255,65,.03) 2px 4px)}
h1{font-size:1.5rem;margin:0 0 .8rem;color:var(--v);
 text-shadow:0 0 12px rgba(0,255,65,.55);letter-spacing:.05em}
p{margin:0;font-size:1.05rem}
</style>
</head>
<body>
<main>
  <h1>Parano1d Pool</h1>
  <p>Pool offline for maintenance</p>
</main>
</body>
</html>
