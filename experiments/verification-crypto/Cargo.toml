[package]
name = "verification-crypto"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
noid_core = { path = "../uc-composition/pinned/noid_core" }
noid_poseidon2b = { path = "../uc-composition/pinned/noid_poseidon2b" }
noid_soundness = { path = "../uc-composition/pinned/noid_soundness" }

[workspace]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = 3
