[package]
name = "verification-wallet-race"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1"
hex = "0.4"
libc = "0.2"
noid_block = { path = "../comp-system-hunter/pinned/noid_block" }
noid_chain = { path = "../comp-system-hunter/pinned/noid_chain" }
noid_core = { path = "../comp-system-hunter/pinned/noid_core" }
noid_gkr = { path = "../comp-system-hunter/pinned/noid_gkr" }
noid_ivc_core = { package = "noid-ivc-core", path = "../comp-system-hunter/pinned/noid_ivc_core" }
noid_mempool = { path = "../comp-system-hunter/pinned/noid_mempool" }
noid_miner = { path = "../comp-system-hunter/pinned/noid_miner" }
noid_poseidon2b = { path = "../comp-system-hunter/pinned/noid_poseidon2b" }
noid_recursive = { path = "../comp-system-hunter/pinned/noid_recursive" }
noid_rpc = { path = "../comp-system-hunter/pinned/noid_rpc" }
noid_tx = { path = "../comp-system-hunter/pinned/noid_tx" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zeroize = { version = "1", features = ["zeroize_derive"] }
zstd = "0.13"

[workspace]
exclude = ["../comp-system-hunter/pinned"]

[profile.dev]
opt-level = 1
debug = 0
