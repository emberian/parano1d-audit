[package]
name = "token-accounting-audit"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"

[dependencies]
noid_chain = { path = "pinned/noid_chain" }
noid_core = { path = "pinned/noid_core" }
noid-ivc-core = { path = "pinned/noid_ivc_core" }
noid_poseidon2b = { path = "pinned/noid_poseidon2b" }
noid_recursive = { path = "pinned/noid_recursive" }
noid_tx = { path = "pinned/noid_tx" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
codegen-units = 16
