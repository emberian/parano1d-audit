<script>
    function setupTable() {
        var table = $('#tblPools').DataTable({
            ajax: '/pools/data-table',
            paging: false,
            searching: false,
            bInfo: false,
            bAutoWidth: false,
            columns: [
                {
                    data: null,
                    render: function (data, type, row) {
                        var letter = (data.coinName || '?').charAt(0).toUpperCase();
                        var fallback = '<span class="coin-fallback">' + letter + '</span>';
                        var logo = data.logo
                            ? '<img alt="" src="' + data.logo + '" data-fallback="' + fallback.replace(/"/g, '&quot;') + '" onerror="this.outerHTML=this.dataset.fallback"/>'
                            : fallback;
                        return '<a style="text-decoration: none" href="' + data.url + '" target="_blank">' + logo +
                            '<span style="color: #52c41a">&nbsp;&nbsp;&nbsp;' + data.coinName + '</span></a>';
                    },
                },
                { data: 'algo' },
                {
                    data: {
                        _: 'poolHashrateText.display',
                        sort: 'poolHashrateText.value',
                    },
                },
                {
                    data: {
                        _: 'networkHashrateText.display',
                        sort: 'networkHashrateText.value',
                    },
                },
                {
                    data: {
                        _: 'poolPercentText.display',
                        sort: 'poolPercentText.value',
                    },
                },
                {
                    data: {
                        _: 'miners.display',
                        sort: 'miners.value',
                    },
                },
            ],
            createdRow: function (row, data, dataIndex) {
            },
            'drawCallback': function (settings) {
                // console.info('draw call back');
            },
        });

        // The API re-polls the pools every 60 s and its response carries
        // max-age=30, so asking twice a minute is as fresh as the data gets.
        setInterval(function () {
            table.ajax.reload();
        }, 30 * 1000);
    }

    $(document).ready(function () {
        setupTable();
        $('#yearText').text('2017-' + new Date().getFullYear());
    });

    function getStat(statUrl) {
        $.ajax({
            url: statUrl, // API endpoint
            type: 'GET', // Method type GET/POST
            crossOrigin: true,
            crossDomain: true,
            "headers": {
                "accept": "application/json",
                "Access-Control-Allow-Origin": "*"
            },
            dataType: 'json', // The type of data expected back from the server
            success: function (data) {
                // Action to perform on success
                console.log(data);
            },
            error: function (xhr, status, error) {
                // Action to perform on error
                console.log(error);
            }
        });
    }
</script>
