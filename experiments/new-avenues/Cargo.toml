[package]
name = "false-availability-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
libp2p = { version = "0.55", features = ["macros"] }
noid_chain = { path = "../../parano1d/noid_chain" }
noid_mempool = { path = "../../parano1d/noid_mempool" }
noid_p2p = { path = "../../parano1d/noid_p2p" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = false
codegen-units = 16
