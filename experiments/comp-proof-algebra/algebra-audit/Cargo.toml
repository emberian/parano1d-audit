[package]
name = "algebra-audit"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
noid_core = { path = "../../uc-composition/pinned/noid_core" }
noid_poseidon2b = { path = "../../uc-composition/pinned/noid_poseidon2b" }
noid_fri = { path = "../../uc-composition/pinned/noid_fri" }
noid_fri_binius = { path = "../../uc-composition/pinned/noid_fri_binius" }
noid_gkr = { path = "../../uc-composition/pinned/noid_gkr" }
noid_ivc_core = { package = "noid-ivc-core", path = "../../uc-composition/pinned/noid_ivc_core" }
noid_soundness = { path = "../../uc-composition/pinned/noid_soundness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = 3
